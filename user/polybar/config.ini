[colors]
background = #121212
background-alt = #8a8a8a
foreground = #e0e0e0
disabled = #9e9e9e

border = #8a8a8a

[bar/example]
width = 100%
height = 24pt

; dpi = 96

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 3pt

padding-left = 1
padding-right = 1

module-margin = 1

separator = |
separator-foreground = ${colors.disabled}

font-0 = Lilex Nerd Font:size=12;2
font-1 = JetBrainsMono Nerd Font Propo:size=12;2
font-2 = Font Awesome 5 Free Solid:size=12;2
font-3 = Material Symbols Rounded:style=Regular:size=12;2

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true

wm-restack = i3

modules-left = arch-logo i3
modules-center = time
modules-right = cpu memory filesystem battery


[module/arch-logo]
type=custom/text

label = 󰣇


[module/i3]
type = internal/i3

; Make workspaces screen-dependent
pin-workspaces = true
enable-click = true

label-focused-underline = ${colors.border}

label-focused = " %name% "

label-unfocused = " %name% "


[module/time]
type = internal/date

label = %time%

time = %H:%M
time-alt = %d/%m/%Y


[module/cpu]
type = internal/cpu

label =  %percentage%%


[module/memory]
type = internal/memory

label =  %percentage_used%% (%percentage_swap_used%%)

[module/filesystem]
type = internal/fs

mount-0 = /

label-mounted =  %percentage_used%%


[module/battery]
type = internal/battery

low-at = 20
ramp-capacity-0 = 
ramp-capacity-1 = 
ramp-capacity-2 = 
ramp-capacity-3 = 
ramp-capacity-4 = 

animation-charging-0 = 
animation-charging-1 = 
animation-charging-2 = 
animation-charging-3 = 
animation-charging-4 = 

format-charging = <animation-charging> <label-charging>
format-discharging = <ramp-capacity> <label-discharging>
label-full =  %percentage%%
